<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            min-width: 150px;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-label {
            opacity: 0.9;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box, .filter-box {
            flex: 1;
            min-width: 250px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .job-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .job-company {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .job-source-badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .source-company {
            background: #10b981;
            color: white;
        }

        .source-linkedin {
            background: #0077b5;
            color: white;
        }

        .source-indeed {
            background: #2557a7;
            color: white;
        }

        .source-remoteok {
            background: #ff6b35;
            color: white;
        }

        .job-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .job-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .job-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.95em;
        }

        .job-detail-icon {
            width: 16px;
            height: 16px;
        }

        .job-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .keywords-section {
            margin-top: 18px;
        }

        .keywords-label {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
        }

        .keywords-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .keyword-tag {
            background: #f0f0ff;
            color: #667eea;
            border: 1px solid #c7d2fe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .keyword-delete {
            background: none;
            border: none;
            color: #a5b4fc;
            cursor: pointer;
            font-size: 1em;
            padding: 0;
            line-height: 1;
            font-weight: 700;
        }

        .keyword-delete:hover { color: #e53e3e; }

        .btn-edit-keywords {
            background: none;
            border: 1px solid #c7d2fe;
            color: #667eea;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 0.8em;
            cursor: pointer;
            margin-left: 8px;
            font-weight: 500;
        }

        .btn-edit-keywords:hover { background: #f0f0ff; }

        .keyword-add-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .keyword-input {
            width: auto;
            padding: 3px 10px;
            border: 1px solid #c7d2fe;
            border-radius: 20px;
            font-size: 0.85em;
            color: #667eea;
            background: #f0f0ff;
        }

        .keyword-input:focus { outline: none; border-color: #667eea; }

        .btn-add-keyword {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add-keyword:hover { background: #764ba2; }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            color: #666;
        }

        .no-results h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .job-source {
            font-size: 0.85em;
            color: #999;
            font-style: italic;
        }

        .job-date {
            font-size: 0.85em;
            color: #999;
        }

        @media (max-width: 768px) {
            .jobs-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .stats {
                gap: 15px;
            }

            .stat-box {
                min-width: 120px;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Job Search Results</h1>
            <p style="color: #666; margin-top: 10px;">Your personalized job opportunities from top Israeli tech companies</p>
            <p style="color: #999; font-size: 0.9em; margin-top: 5px;">Last updated: July 26, 2026 at 02:50 AM</p>
            <div class="keywords-section">
                <div class="keywords-label">
                    Searching for:
                    <button class="btn-edit-keywords" id="editKeywordsBtn" onclick="toggleKeywordEdit()">Edit</button>
                </div>
                <div class="keywords-tags" id="keywordTags"></div>
            </div>
            <div class="stats" id="stats"></div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search jobs by title or keyword...">
            </div>
            <div class="filter-box">
                <select id="sourceFilter">
                    <option value="">All Sources</option>
                    <option value="Company Website">Company Websites</option>
                    <option value="LinkedIn">LinkedIn</option>
                    <option value="Indeed">Indeed</option>
                    <option value="RemoteOK">RemoteOK</option>
                </select>
            </div>
            <div class="filter-box">
                <select id="companyFilter">
                    <option value="">All Companies</option>
                </select>
            </div>
            <div class="filter-box">
                <select id="locationFilter">
                    <option value="">All Locations</option>
                </select>
            </div>
        </div>

        <div class="jobs-grid" id="jobsGrid"></div>
    </div>

    <script>
        // Keywords management
        const embeddedKeywords = ["head of operations", "director of operations", "director of business operations", "head of projects", "project management", "operations manager", "vp operations", "vp of operations", "chief of staff", "COO", "business operations", "operations lead", "program manager", "programme manager"];
        let activeKeywords = JSON.parse(localStorage.getItem('customKeywords') || 'null') || [...embeddedKeywords];
        let editingKeywords = false;

        function renderKeywords() {
            const container = document.getElementById('keywordTags');
            const tags = activeKeywords.map((kw, i) =>
                `<span class="keyword-tag">${kw}${editingKeywords ? `<button class="keyword-delete" onclick="deleteKeyword(${i})" title="Remove">×</button>` : ''}</span>`
            ).join('');
            const addInput = editingKeywords ? `
                <span class="keyword-add-wrap">
                    <input type="text" id="newKeywordInput" class="keyword-input" placeholder="Add keyword..." onkeydown="if(event.key==='Enter')addKeyword()">
                    <button class="btn-add-keyword" onclick="addKeyword()">Add</button>
                </span>` : '';
            container.innerHTML = tags + addInput;
            if (editingKeywords) {
                const inp = document.getElementById('newKeywordInput');
                if (inp) inp.focus();
            }
        }

        function toggleKeywordEdit() {
            editingKeywords = !editingKeywords;
            document.getElementById('editKeywordsBtn').textContent = editingKeywords ? 'Done' : 'Edit';
            renderKeywords();
        }

        function deleteKeyword(index) {
            activeKeywords.splice(index, 1);
            localStorage.setItem('customKeywords', JSON.stringify(activeKeywords));
            renderKeywords();
        }

        function addKeyword() {
            const input = document.getElementById('newKeywordInput');
            const val = input.value.trim();
            if (!val) return;
            if (!activeKeywords.map(k => k.toLowerCase()).includes(val.toLowerCase())) {
                activeKeywords.push(val);
                localStorage.setItem('customKeywords', JSON.stringify(activeKeywords));
            }
            input.value = '';
            renderKeywords();
        }

"title": "Head of Operations", "company": "Okoora", "location": "Ramat Gan, Tel Aviv District, Israel", "url": "https://il.linkedin.com/jobs/view/head-of-operations-at-okoora-4368086007", "description": "", "posted_date": "Recent", "source": "LinkedIn", "job_id": "4175453485ee67418ddcfaecfb1077e6", "found_date": "2026-02-14T23:22:58.239611"}, "a38cad2e2ed083e314ab61225d72dc35": {"title": "Head of Operations", "company": "Ozio Limited", "location": "Raanana, Center District, Israel", "url": "https://il.linkedin.com/jobs/view/head-of-operations-at-ozio-limited-4355269021", "description": "", "posted_date": "Recent", "source": "LinkedIn", "job_id": "a38cad2e2ed083e314ab61225d72dc35", "found_date": "2026-02-14T23:22:58.239761"}};
        let allJobs = Object.values(jobsData);
        
        function getSourceType(source) {
            if (source.includes('LinkedIn')) return 'LinkedIn';
            if (source.includes('Indeed')) return 'Indeed';
            if (source.includes('RemoteOK')) return 'RemoteOK';
            if (source.includes('Company Website')) return 'Company Website';
            return source;
        }

        function displayStats() {
            const companies = new Set(allJobs.map(job => job.company)).size;
            const locations = new Set(allJobs.map(job => job.location)).size;
            const sources = new Set(allJobs.map(job => getSourceType(job.source))).size;
            
            document.getElementById('stats').innerHTML = `
                <div class="stat-box">
                    <div class="stat-number">${allJobs.length}</div>
                    <div class="stat-label">Total Jobs</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">${companies}</div>
                    <div class="stat-label">Companies</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">${sources}</div>
                    <div class="stat-label">Sources</div>
                </div>
            `;
        }

        function populateFilters() {
            const companies = [...new Set(allJobs.map(job => job.company))].sort();
            const locations = [...new Set(allJobs.map(job => job.location))].sort();
            
            const companyFilter = document.getElementById('companyFilter');
            companies.forEach(company => {
                const option = document.createElement('option');
                option.value = company;
                option.textContent = company;
                companyFilter.appendChild(option);
            });

            const locationFilter = document.getElementById('locationFilter');
            locations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                locationFilter.appendChild(option);
            });
        }

        function displayJobs(jobs) {
            const grid = document.getElementById('jobsGrid');
            
            if (jobs.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h2>No jobs found</h2>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = jobs.map(job => {
                const date = new Date(job.found_date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                const sourceType = getSourceType(job.source);
                let sourceBadgeClass = 'source-company';
                if (sourceType === 'LinkedIn') sourceBadgeClass = 'source-linkedin';
                else if (sourceType === 'Indeed') sourceBadgeClass = 'source-indeed';
                else if (sourceType === 'RemoteOK') sourceBadgeClass = 'source-remoteok';

                return `
                    <div class="job-card">
                        <div class="job-header">
                            <div class="job-company">${job.company}</div>
                        </div>
                        <div style="margin-bottom: 10px;">
                            <span class="job-source-badge ${sourceBadgeClass}">${sourceType}</span>
                        </div>
                        <div class="job-title">${job.title}</div>
                        <div class="job-details">
                            <div class="job-detail">
                                <svg class="job-detail-icon" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                                </svg>
                                ${job.location}
                            </div>
                            <div class="job-date">Found: ${date}</div>
                        </div>
                        <div class="job-actions">
                            <a href="${job.url}" target="_blank" class="btn btn-primary">View Job →</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterJobs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sourceFilter = document.getElementById('sourceFilter').value;
            const companyFilter = document.getElementById('companyFilter').value;
            const locationFilter = document.getElementById('locationFilter').value;

            const filtered = allJobs.filter(job => {
                const matchesSearch = job.title.toLowerCase().includes(searchTerm) || 
                                     job.company.toLowerCase().includes(searchTerm);
                const matchesSource = !sourceFilter || getSourceType(job.source) === sourceFilter;
                const matchesCompany = !companyFilter || job.company === companyFilter;
                const matchesLocation = !locationFilter || job.location === locationFilter;
                
                return matchesSearch && matchesSource && matchesCompany && matchesLocation;
            });

            displayJobs(filtered);
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterJobs);
        document.getElementById('sourceFilter').addEventListener('change', filterJobs);
        document.getElementById('companyFilter').addEventListener('change', filterJobs);
        document.getElementById('locationFilter').addEventListener('change', filterJobs);

        // Initialize on page load
        renderKeywords();
        displayStats();
        populateFilters();
        displayJobs(allJobs);
    </script>
